plugins {
    id 'com.android.application'
}

android {
    namespace 'com.clawd'
    compileSdk 34

    defaultConfig {
        applicationId "com.clawd"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
}
